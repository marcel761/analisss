<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fish-It RNG Analyzer — Fase 3</title>

<style>
  :root{
    --bg:#07080b; --card:#0f1720; --muted:#9fb0c8;
    --accent:#38bdf8; --accent2:#60a5fa; --glass:rgba(255,255,255,0.03);
  }
  *{box-sizing:border-box;font-family:Inter, system-ui, Arial, sans-serif}
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#051226);color:#e6eef6}
  header{position:fixed;left:0;right:0;top:0;height:60px;background:rgba(255,255,255,0.02);display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.05)}
  .brand{display:flex;gap:12px;align-items:center}
  .logo{width:40px;height:40;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#042033}
  main{position:fixed;left:0;right:0;top:60px;bottom:0;overflow:auto;padding:16px}
  .wrap{max-width:900px;margin:0 auto}
  .card{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.04);padding:16px;border-radius:12px;margin-bottom:16px}
  h2{margin-top:0;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  label{font-size:13px;color:var(--muted)}
  input[type=number]{width:100%;padding:10px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.05);color:white}
  .btn{padding:10px 12px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#042033;font-weight:700;cursor:pointer;margin-top:8px}
  #output{margin-top:12px;padding:12px;background:rgba(56,189,248,0.05);border-radius:10px;display:none}
  canvas{width:100%;height:220px;border-radius:8px;margin-top:12px;background:transparent}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">FI</div>
    <div>
      <div style="font-weight:800;">Fish-It RNG Analyzer</div>
      <div style="font-size:12px;color:var(--muted)">Versi Fase 1–3</div>
    </div>
  </div>
</header>

<main>
<div class="wrap">

  <!-- FASE 1: INPUT -->
  <div class="card">
    <h2>Input Hasil Mancing</h2>

    <div class="grid">
      <div>
        <label>Total Cast</label>
        <input id="total" type="number" value="500">
      </div>
      <div>
        <label>Common</label>
        <input id="common" type="number">
      </div>
      <div>
        <label>Uncommon</label>
        <input id="uncommon" type="number">
      </div>
      <div>
        <label>Rare</label>
        <input id="rare" type="number">
      </div>
      <div>
        <label>Epic</label>
        <input id="epic" type="number">
      </div>
      <div>
        <label>Legendary</label>
        <input id="legend" type="number">
      </div>
      <div>
        <label>Mythic</label>
        <input id="mythic" type="number">
      </div>
    </div>

    <button class="btn" id="analyzeBtn">Analisis</button>

    <div id="output"></div>
  </div>

  <!-- FASE 2: ANALISIS -->
  <div class="card">
    <h2>Ringkasan Analisis</h2>
    <div id="summary" style="font-size:14px;color:var(--muted)">Belum ada data.</div>
  </div>

  <!-- FASE 3: TREND CHART -->
  <div class="card">
    <h2>Grafik Trend Rare+</h2>
    <canvas id="trendChart"></canvas>
  </div>

</div>
</main>

<script>
  let trend = [];
  const cvs = document.getElementById('trendChart');
  const ctx = cvs.getContext('2d');

  function resizeCanvas(){
    cvs.width = cvs.clientWidth * devicePixelRatio;
    cvs.height = 220 * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawTrend(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    if(trend.length === 0){
      ctx.fillStyle = "#9fb0c8";
      ctx.fillText("Belum ada window data.", 10, 20);
      return;
    }
    const max = Math.max(...trend);
    const barWidth = (cvs.clientWidth / trend.length) - 4;

    trend.forEach((v,i)=>{
      const h = (v / max) * 180;
      ctx.fillStyle = v >= max*0.75 ? "#16a34a" : "#eab308";
      ctx.fillRect(i*(barWidth+4), 200-h, barWidth, h);
    });
  }

  document.getElementById("analyzeBtn").onclick = () => {
    const T = Number(total.value);
    const C = Number(common.value||0);
    const U = Number(uncommon.value||0);
    const R = Number(rare.value||0);
    const E = Number(epic.value||0);
    const L = Number(legend.value||0);
    const M = Number(mythic.value||0);

    const rarePlus = R+E+L+M;
    trend.push(rarePlus);
    if(trend.length > 30) trend.shift();

    summary.innerText = `Rare+: ${rarePlus} (window ke-${trend.length})`;
    output.style.display="block";
    output.innerText = 
      `📌 Cast: ${T}\n`+
      `Rare+: ${rarePlus}\n`+
      `Legend: ${L}, Epic: ${E}, Mythic: ${M}\n\n`+
      `Grafik telah diperbarui.`;

    drawTrend();
  };
</script>

</body>
</html>
